version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: vcorp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vcorp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vcorp-network

  app:
    build: .
    container_name: vcorp-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vcorp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQL15Dialect
      SPRING_AI_OPENAI_API_KEY: ${OPENAI_DEV_KEY}
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_VCORP: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vcorp-network

volumes:
  postgres_data:
    driver: local

networks:
  vcorp-network:
    driver: bridge