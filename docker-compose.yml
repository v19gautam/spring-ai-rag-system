version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: vcorp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vcorp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vcorp-network

  redis:
    image: redis/redis-stack:latest
    container_name: vcorp-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vcorp-network

  app:
    build: .
    container_name: vcorp-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_AI_OPENAI_API_KEY: ${OPEN_AI_DEV_KEY}
      DB_URL: jdbc:postgresql://postgres:5432/vcorp
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
#      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQL15Dialect
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_VCORP: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vcorp-network

volumes:
  postgres_data:
    driver: local

networks:
  vcorp-network:
    driver: bridge