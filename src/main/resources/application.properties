spring.application.name=vcorp-ai-backend

server.port=8081
spring.ai.openai.api-key=${OPEN_AI_DEV_KEY}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/vcorp
spring.datasource.username=postgres
spring.datasource.password=password

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration